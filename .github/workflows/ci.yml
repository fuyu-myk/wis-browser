name: CI

# Compiles + tests the workspace and the frontend on every supported OS.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  # Manual run (Actions tab or `gh workflow run`), so a branch can be compiled
  # on all three OSes without opening a PR to main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WebKitGTK (the Linux webview) + AppImage/packaging tooling.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/shell/pnpm-lock.yaml

      # Matches rust-toolchain.toml.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: crates/shell
        run: pnpm install --frozen-lockfile

      # Builds the dist bundle the Tauri build script embeds via
      # `generate_context!`, and type-checks the frontend (tsc).
      - name: Build frontend
        working-directory: crates/shell
        run: pnpm build

      - name: Lint frontend
        working-directory: crates/shell
        run: pnpm lint

      - name: Test frontend
        working-directory: crates/shell
        run: pnpm test

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets
