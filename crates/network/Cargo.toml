[package]
name = "wis-network"
description = "Privacy decision engine for the Wis browser: DoH, tracker blocking, HTTPS-First."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "wis_network"
path = "src/lib.rs"

[dependencies]
wis-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

hickory-resolver = { workspace = true }
adblock = { workspace = true }
reqwest = { workspace = true }

# Proxy server
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
socket2 = "0.6"

# Built-in Tor (Arti), default-off.
arti-client = { version = "0.34", default-features = false, features = ["tokio", "rustls"], optional = true }
tor-rtcompat = { version = "0.34", optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
http-body-util = "0.1"

[features]
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:tokio-util"]
