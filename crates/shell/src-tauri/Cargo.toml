[package]
name = "wis-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
# Direct deps on the vendored wry and tauri-runtime-wry (via [patch.crates-io])
# for their Wis hooks: the download side channels, the `window.ipc` global and
# Tauri's page scripts (WIS-PATCH.md).
wry = { version = "0.55", default-features = false }
tauri-runtime-wry = { version = "2.11", default-features = false }
reqwest = { workspace = true }
futures-util = "0.3"
sha2 = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }

wis-core = { workspace = true }
wis-storage = { workspace = true }
wis-network = { workspace = true }
wis-secrets = { workspace = true }
wis-import = { workspace = true }

[features]
# Built-in Tor client (Arti) is bundled by default. Build with
# `--no-default-features` to omit it.
default = ["tor"]
tor = ["wis-network/tor"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
block2 = "0.5"
libc = "0.2"
# Both are already in the tree through tauri and wry.
objc2-06 = { package = "objc2", version = "0.6" }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKPreferences",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKWebExtension",
    "WKWebExtensionContext",
    "WKWebExtensionController",
    "WKWebExtensionControllerConfiguration",
    "WKWebExtensionControllerDelegate",
    "WKWebExtensionDataRecord",
    "WKWebExtensionDataType",
    "WKWebExtensionMatchPattern",
    "WKWebExtensionPermission",
    "WKWebExtensionTab",
    "WKWebExtensionWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSKeyValueCoding", "NSObject", "NSSet", "NSString", "NSURL", "NSUUID"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView"] }
block2-06 = { package = "block2", version = "0.6" }
# Unpacking extension .zip files; flate2's Rust backend is already in the tree.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Windows Hello biometric gate (UserConsentVerifier) for the password vault,
# plus webview2-com to reach the WebView2 COM handles (mute, print, ...) behind
# a Tauri webview.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.2"
webview2-com = "0.38"
# Strip the `\\?\` verbatim prefix `fs::canonicalize` adds on Windows.
dunce = "1"

# Forward a second launch's argv (a link clicked in another app while Wis is
# running) to the existing instance.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Cross-platform clipboard + native file dialogs (the macOS path uses NSPasteboard
# / NSSave-OpenPanel directly; these cover the Windows/Linux equivalents).
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = "0.16"
# Decode/encode PNG for the capture clipboard and region crop (Windows
# CapturePreview, Linux cairo snapshot).
png = "0.17"

# Reach the WebKitGTK webview behind a Tauri webview (zoom, mute, print) via
# `PlatformWebview::inner()`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
gtk = "0.18"
# Read a page->chrome message body off a WebKitGTK `JavascriptResult`.
javascriptcore-rs = "1.1"
# Find WebKitGTK 2.42's feature switches at run time, for canvas card isolation.
libc = "0.2"
