<!doctype html>
<meta charset="utf-8">
<script>
  addEventListener('message', function take(e) {
    var data = e.data
    if (parent === window || e.source !== parent || !data || typeof data.html !== 'string') return
    removeEventListener('message', take)
    var links = document.createElement('link').relList
    var open = []
    if (typeof RTCPeerConnection !== 'undefined') open.push('WebRTC')
    if (links.supports('preconnect')) open.push('preconnect')
    if (links.supports('dns-prefetch')) open.push('DNS prefetch')
    if (open.length > 0) {
      document.body.textContent = 'HTML cards are off: this WebKit could let them reach the network (' + open.join(', ') + ').'
      return
    }
    document.open()
    document.write(data.html)
    document.close()
    var scheme = null
    function follow(theme) {
      if (theme !== 'light' && theme !== 'dark') return
      if (!scheme) {
        scheme = document.createElement('meta')
        scheme.name = 'color-scheme'
        document.head.prepend(scheme)
      }
      scheme.content = theme
    }
    follow(data.theme)
    addEventListener('message', function (m) {
      if (m.source === parent && m.data) follow(m.data.wisTheme)
    })
    addEventListener('keydown', function (k) {
      if (k.key === 'Escape') parent.postMessage({ wisCard: 'escape' }, '*')
    }, true)
  })
</script>
