[workspace]
resolver = "2"
members = [
    "crates/shell/src-tauri",
    "crates/core",
    "crates/storage",
    "crates/network",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Errors
thiserror = "2"
anyhow = "1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", default-features = false, features = ["std"] }

# URL handling
url = { version = "2", features = ["serde"] }

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tauri
tauri = { version = "2.11.2", features = ["macos-private-api", "unstable", "macos-proxy", "image-png"] }
tauri-build = "2.6.2"
tauri-plugin-log = "2"

# Database
rusqlite = { version = "0.34", features = ["bundled", "chrono", "url"] }
rusqlite_migration = "2"

# Networking & privacy
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "https-ring", "webpki-roots"] }
adblock = { version = "0.12", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Crypto / encoding (favicon cache: SHA-256 origin hash, base64 data URLs)
sha2 = "0.10"
base64 = "0.22"

# Internal crates
wis-core = { path = "crates/core" }
wis-storage = { path = "crates/storage" }
wis-network = { path = "crates/network" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
